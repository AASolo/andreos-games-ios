name: AndreosPlay
options:
  bundleIdPrefix: com.andreos
  deploymentTarget:
    iOS: "15.0"
targets:
  AndreosPlay:
    type: application
    platform: iOS
    sources:
      - path: AndreosPlay
      # Меню и игры (кладёт сюда scripts/build.sh при сборке)
      - path: www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: AndreosPlay
        PRODUCT_BUNDLE_IDENTIFIER: com.andreos.play
        INFOPLIST_FILE: AndreosPlay/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
